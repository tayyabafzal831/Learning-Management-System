<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- DASHBOARD HEADER -->
        <div class="dashboard-header">

            <div>
                <h1>Learning Management System</h1>

                <p>
                    Learn, practice and complete your courses
                </p>
            </div>


            <div class="user-info">

                <p>
                    Welcome,
                    <strong id="usernameDisplay"></strong>
                </p>

                <p>
                    Role:
                    <strong id="roleDisplay"></strong>
                </p>

            </div>


            <button id="logoutBtn">
                Logout
            </button>

        </div>

        <!-- ADMIN USER MANAGEMENT -->
        <div class="course-section" id="userManagementSection" style="display: none;">

            <div class="section-header">
                <h2>Manage Users / Students</h2>
            </div>

            <h3>Add Student</h3>

            <form id="addUserForm">

                <input type="text" id="newUsername" placeholder="Username" required>

                <input type="password" id="newPassword" placeholder="Password" required>

                <input type="text" id="newName" placeholder="Full Name" required>

                <input type="email" id="newEmail" placeholder="Email" required>

                <input type="number" id="newAge" placeholder="Age" min="0" max="50" required>

                <button type="submit">
                    Add Student
                </button>

            </form>

            <p id="addUserMessage"></p>


            <h3>Users / Students</h3>

            <div id="userListContainer">
                <p>Loading users...</p>
            </div>

        </div>

        <!-- COURSES -->
        <div class="course-section">

            <div class="section-header">

                <h2>Available Courses</h2>

            </div>


            <div id="courseContainer" class="course-container">

                <p>
                    Loading courses...
                </p>

            </div>

        </div>


        <!-- ADMIN NOTIFICATIONS -->
        <div class="notification-section" id="notificationSection" style="display: none;">

            <div class="section-header">

                <h2>
                    Admin Notifications
                </h2>

            </div>


            <div id="notificationContainer">

                <p>
                    No notifications yet.
                </p>

            </div>

        </div>

    </div>


    <script src="dashboard.js"></script>

</body>

</html>
